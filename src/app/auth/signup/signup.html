<div class="auth-page">
  <div class="toggle-slot-group">
    <app-language-toggle [lang]="languageService.lang()" (toggled)="languageService.toggle()" />
    <app-theme-toggle [theme]="themeService.theme()" (toggled)="themeService.toggle()" />
  </div>

  <div class="auth-shell">
    <!-- Left: form panel -->
    <section class="form-panel">
      <div class="form-panel__inner">
        <div class="brand-mini">
          <span class="brand-mini__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
            </svg>
          </span>
          <span class="brand-mini__name">SAMAKI FARM</span>
        </div>

        <h1 class="form-title">{{ t().title }}</h1>
        <p class="form-subtitle">{{ t().subtitle }}</p>

        <form (ngSubmit)="submit()" #signupForm="ngForm">
          @if (errorMessage()) {
            <div class="alert alert--error" role="alert" aria-live="assertive">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span>{{ errorMessage() }}</span>
            </div>
          }

          <div class="field">
            <label class="field__label" for="farmName">{{ t().farmNameLabel }}</label>
            <div class="field__control">
              <input
                id="farmName"
                name="farmName"
                type="text"
                [(ngModel)]="farmName"
                required
                [placeholder]="t().farmNamePlaceholder"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="farmLocation">{{ t().farmLocationLabel }} <span class="field__optional">{{ t().optional }}</span></label>
            <div class="field__control">
              <input
                id="farmLocation"
                name="farmLocation"
                type="text"
                [(ngModel)]="farmLocation"
                [placeholder]="t().farmLocationPlaceholder"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="ownerName">{{ t().ownerNameLabel }}</label>
            <div class="field__control">
              <input
                id="ownerName"
                name="ownerName"
                type="text"
                [(ngModel)]="ownerName"
                required
                [placeholder]="t().ownerNamePlaceholder"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="phone">{{ t().phoneLabel }}</label>
            <div class="field__control">
              <input id="phone" name="phone" type="text" [(ngModel)]="phone" required autocomplete="tel" placeholder="0712345678" />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
                  />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="email">{{ t().emailLabel }} <span class="field__optional">{{ t().optional }}</span></label>
            <div class="field__control">
              <input
                id="email"
                name="email"
                type="email"
                [(ngModel)]="email"
                autocomplete="email"
                [placeholder]="t().emailPlaceholder"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="password">{{ t().passwordLabel }}</label>
            <div class="field__control">
              <input
                id="password"
                name="password"
                [type]="hidePassword() ? 'password' : 'text'"
                [(ngModel)]="password"
                required
                minlength="6"
                autocomplete="new-password"
                [placeholder]="t().passwordPlaceholder"
              />
              <button
                type="button"
                class="field__toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="hidePassword() ? t().showPassword : t().hidePassword"
              >
                @if (hidePassword()) {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                } @else {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                    />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                }
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary" [disabled]="loading() || signupForm.invalid">
            @if (loading()) {
              <span class="btn-spinner" aria-hidden="true"></span>
              <span>{{ t().submitting }}</span>
            } @else {
              <span>{{ t().submit }}</span>
            }
          </button>

          <p class="form-switch">{{ t().haveAccount }} <a routerLink="/login">{{ t().login }}</a></p>
        </form>
      </div>

      <p class="form-footer">{{ t().footer }} {{ currentYear }}</p>
    </section>

    <!-- Right: brand panel -->
    <aside class="brand-panel" aria-hidden="true">
      <div class="brand-panel__content">
        <h2 class="brand-panel__headline">{{ t().brandHeadline }}</h2>
        <p class="brand-panel__text">{{ t().brandText }}</p>
      </div>
    </aside>
  </div>
</div>
