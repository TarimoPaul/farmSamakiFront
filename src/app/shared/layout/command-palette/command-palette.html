<button
  #trigger
  type="button"
  class="palette-trigger"
  aria-haspopup="dialog"
  aria-keyshortcuts="Control+K Meta+K"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="t().paletteLabel"
  (click)="openPalette()"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="11" cy="11" r="8" />
    <line x1="21" y1="21" x2="16.65" y2="16.65" />
  </svg>
  <span class="palette-trigger__text" aria-hidden="true">{{ t().searchPlaceholder }}</span>
  <kbd class="palette-trigger__kbd" aria-hidden="true">{{ shortcut }}</kbd>
</button>

@if (open()) {
  <div class="palette-scrim" (click)="close()"></div>

  <div class="palette" role="dialog" aria-modal="true" [attr.aria-label]="t().paletteLabel">
    <div class="palette__search">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        #searchInput
        type="text"
        class="palette__input"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="true"
        aria-controls="palette-results"
        [attr.aria-activedescendant]="results().length ? 'palette-option-' + active() : null"
        [attr.aria-label]="t().paletteLabel"
        [placeholder]="t().searchPlaceholder"
        [value]="query()"
        autocomplete="off"
        spellcheck="false"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
      />
      <kbd class="palette__kbd" aria-hidden="true">Esc</kbd>
    </div>

    @if (results().length) {
      <ul #list id="palette-results" class="palette__results" role="listbox">
        @for (entry of results(); track entry.route; let i = $index) {
          <li
            [id]="'palette-option-' + i"
            role="option"
            class="palette__option"
            [class.palette__option--active]="i === active()"
            [attr.aria-selected]="i === active()"
            (mousemove)="active.set(i)"
            (click)="go(entry)"
          >
            <span class="palette__label">{{ entry.label }}</span>
            @if (entry.group) {
              <span class="palette__group">{{ entry.group }}</span>
            }
          </li>
        }
      </ul>
    } @else {
      <p id="palette-results" class="palette__empty" role="status">{{ t().paletteEmpty }}</p>
    }

    <p class="palette__hint" aria-hidden="true">{{ t().paletteHint }}</p>
  </div>
}
