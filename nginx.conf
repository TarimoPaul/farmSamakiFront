# nginx ya NDANI ya image ya frontend: faili za SPA pekee.
# /api na /graphql HAZIJI hapa - nginx ya nje inazipeleka kwa samaki-backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html isikae kwenye cache: ndiyo inayotaja majina mapya ya
    # bundle (outputHashing=all) baada ya kila deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Faili zenye hash kwenye jina hazibadiliki kamwe.
    location ~* \.(?:js|css|woff2?|ttf|ico|svg|png|jpe?g|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /dashboard, /feeding ... ni routes za Angular, si faili.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
